<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      모바일 전용 뷰포트.
      - viewport-fit=cover : iOS 노치/홈 인디케이터 영역까지 그려서 safe-area-inset을 쓸 수 있게 합니다.
      - maximum-scale / user-scalable=no : 앱 WebView 안에서 더블탭 확대와 입력 포커스 시 자동 줌을 막습니다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#ffffff" />
    <title>PuppyNote</title>
    <!--
      카카오맵 JS SDK. `autoload=false`는 지도를 쓰는 화면(산책 상세)에 들어가기 전까지
      초기화를 미루기 위해서입니다 — 실제 로드는 `src/services/map/kakaoMap.ts`가 담당합니다.
      %VITE_KAKAO_MAP_APP_KEY%는 Vite가 빌드/개발 서버 기동 시 .env 값으로 치환합니다.
    -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=%VITE_KAKAO_MAP_APP_KEY%&autoload=false"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
